      <stop offset="0%" stop-color="#1a0a0c"/>
      <stop offset="100%" stop-color="#2b0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e60026"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
  </defs>
  <rect width="520" height="120" rx="14" fill="url(#bg)" stroke="#5a1822" stroke-width="1"/>
  <rect x="0" y="0" width="6" height="120" rx="3" fill="url(#accent)"/>
  <text x="24" y="32" fill="#ff8a9a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">NETEASE / sorrowQA</text>
  <text x="24" y="68" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700">4,984</text>
